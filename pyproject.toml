[project]
name = "teme-curs-ai"
version = "0.1.0"
description = "Teme curs Agentic AI - Grigoras Andrei"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "openai>=3.51.0",
    "pydantic[email]>=2.14.3",
    "pymupdf4llm<2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
